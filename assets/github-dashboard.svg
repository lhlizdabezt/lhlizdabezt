<svg width="900" height="280" viewBox="0 0 900 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Luong Hai Long GitHub portfolio status dashboard</title>
  <desc id="desc">Line-free dashboard showing public repositories, owned evidence repositories and core engineering tracks for review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="0.48" stop-color="#082f49"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#34d399"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <style>
      .titleText { font: 800 24px Arial, Helvetica, sans-serif; fill: #f8fafc; letter-spacing: 0; }
      .smallText { font: 600 12px Arial, Helvetica, sans-serif; fill: #bae6fd; letter-spacing: 0; }
      .metricValue { font: 900 30px Arial, Helvetica, sans-serif; fill: #ffffff; letter-spacing: 0; }
      .metricLabel { font: 700 12px Arial, Helvetica, sans-serif; fill: #dbeafe; letter-spacing: 0; }
      .metricSub { font: 500 10.5px Arial, Helvetica, sans-serif; fill: #93c5fd; letter-spacing: 0; }
      .mono { font: 700 13px Consolas, Monaco, monospace; fill: #e2e8f0; letter-spacing: 0; }
      .tile { fill: #0b1220; stroke: #1e293b; stroke-width: 1; }
      .panel { fill: rgba(2,6,23,.76); stroke: rgba(148,163,184,.30); stroke-width: 1; }
      .motion { animation: fade 3s ease-in-out infinite; }
      @keyframes fade { 0%, 100% { opacity: .72; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="900" height="280" rx="24" fill="url(#bg)"/>
  <rect x="28" y="28" width="402" height="224" rx="18" class="panel"/>
  <rect x="470" y="28" width="402" height="224" rx="18" class="panel"/>

  <rect class="motion" x="54" y="48" width="92" height="5" rx="2.5" fill="url(#green)"/>
  <text x="54" y="78" class="titleText">Profile status</text>
  <text x="54" y="101" class="smallText">Verified on August 24, 2026 for HR and engineering review</text>

  <g transform="translate(54 120)">
    <rect class="tile" x="0" y="0" width="346" height="54" rx="10"/>
    <text x="16" y="34" class="metricValue">32</text>
    <text x="86" y="23" class="metricLabel">public repos</text>
    <text x="86" y="39" class="metricSub">portfolio scope</text>

    <rect class="tile" x="0" y="70" width="346" height="54" rx="10"/>
    <text x="16" y="104" class="metricValue">29</text>
    <text x="86" y="93" class="metricLabel">owned repos</text>
    <text x="86" y="109" class="metricSub">core evidence</text>
  </g>

  <rect class="motion" x="496" y="48" width="92" height="5" rx="2.5" fill="url(#blue)"/>
  <text x="496" y="78" class="titleText">Evidence tracks</text>
  <text x="496" y="101" class="smallText">Main signals kept above general coursework</text>

  <g transform="translate(496 124)">
    <text x="0" y="0" class="mono">Vision Bio ML</text>
    <rect x="122" y="-10" width="226" height="12" rx="6" fill="#1e293b"/>
    <rect class="motion" x="122" y="-10" width="206" height="12" rx="6" fill="url(#blue)"/>

    <text x="0" y="28" class="mono">RF Comms</text>
    <rect x="122" y="18" width="226" height="12" rx="6" fill="#1e293b"/>
    <rect x="122" y="18" width="184" height="12" rx="6" fill="url(#amber)"/>

    <text x="0" y="56" class="mono">Embedded</text>
    <rect x="122" y="46" width="226" height="12" rx="6" fill="#1e293b"/>
    <rect x="122" y="46" width="158" height="12" rx="6" fill="url(#green)"/>

    <text x="0" y="84" class="mono">FPGA SoC ASIC</text>
    <rect x="122" y="74" width="226" height="12" rx="6" fill="#1e293b"/>
    <rect x="122" y="74" width="142" height="12" rx="6" fill="#a78bfa"/>

    <text x="0" y="112" class="mono">DSP and ML</text>
    <rect x="122" y="102" width="226" height="12" rx="6" fill="#1e293b"/>
    <rect x="122" y="102" width="184" height="12" rx="6" fill="#22d3ee"/>
  </g>

</svg>

<svg width="900" height="260" viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Luong Hai Long GitHub portfolio dashboard</title>
  <desc id="desc">Static GitHub portfolio dashboard showing public repositories, releases, engineering focus and top languages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#111827"/>
      <stop offset="1" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#34d399"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <style>
      .label { font: 600 14px Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; }
      .small { font: 500 12px Inter, Segoe UI, Arial, sans-serif; fill: #94a3b8; }
      .title { font: 800 22px Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; }
      .number { font: 900 38px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
      .mono { font: 700 13px Consolas, Monaco, monospace; fill: #e2e8f0; }
      .bar { rx: 7; ry: 7; }
      @keyframes glow {
        0%, 100% { opacity: .68; }
        50% { opacity: 1; }
      }
      .pulse { animation: glow 2.4s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="900" height="260" rx="24" fill="url(#bg)"/>
  <circle class="pulse" cx="760" cy="44" r="120" fill="#2563eb" opacity="0.14"/>
  <circle class="pulse" cx="120" cy="214" r="105" fill="#14b8a6" opacity="0.12"/>

  <g filter="url(#shadow)">
    <rect x="28" y="28" width="402" height="204" rx="18" fill="#020617" opacity="0.72" stroke="#1e293b"/>
    <text x="54" y="66" class="title">GitHub stats</text>
    <text x="54" y="91" class="small">Portfolio snapshot for engineering review</text>

    <g transform="translate(54 118)">
      <text x="0" y="0" class="number">20</text>
      <text x="70" y="-17" class="label">public repositories</text>
      <text x="70" y="4" class="small">coursework, labs, reports and tooling</text>
    </g>

    <g transform="translate(54 176)">
      <text x="0" y="0" class="number">11+</text>
      <text x="86" y="-17" class="label">tagged releases</text>
      <text x="86" y="4" class="small">public review assets, PDFs and source bundles</text>
    </g>

    <rect x="54" y="204" width="320" height="8" rx="4" fill="#1e293b"/>
    <rect class="bar pulse" x="54" y="204" width="256" height="8" fill="url(#green)"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="470" y="28" width="402" height="204" rx="18" fill="#020617" opacity="0.72" stroke="#1e293b"/>
    <text x="496" y="66" class="title">Top languages</text>
    <text x="496" y="91" class="small">Main stacks visible across the portfolio</text>

    <text x="496" y="122" class="mono">Python</text>
    <rect x="590" y="110" width="238" height="12" rx="6" fill="#1e293b"/>
    <rect class="bar" x="590" y="110" width="214" height="12" fill="url(#blue)"/>

    <text x="496" y="149" class="mono">MATLAB</text>
    <rect x="590" y="137" width="238" height="12" rx="6" fill="#1e293b"/>
    <rect class="bar" x="590" y="137" width="178" height="12" fill="url(#orange)"/>

    <text x="496" y="176" class="mono">C/C++</text>
    <rect x="590" y="164" width="238" height="12" rx="6" fill="#1e293b"/>
    <rect class="bar" x="590" y="164" width="144" height="12" fill="url(#green)"/>

    <text x="496" y="203" class="mono">Verilog/VHDL</text>
    <rect x="590" y="191" width="238" height="12" rx="6" fill="#1e293b"/>
    <rect class="bar" x="590" y="191" width="128" height="12" fill="#a78bfa"/>

    <text x="496" y="230" class="mono">Typst</text>
    <rect x="590" y="218" width="238" height="12" rx="6" fill="#1e293b"/>
    <rect class="bar" x="590" y="218" width="112" height="12" fill="#22d3ee"/>
  </g>
</svg>

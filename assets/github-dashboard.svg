<svg width="900" height="280" viewBox="0 0 900 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Luong Hai Long GitHub portfolio dashboard</title>
  <desc id="desc">Balanced GitHub portfolio dashboard showing public repositories, releases, engineering focus and top languages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="0.52" stop-color="#111827"/>
      <stop offset="1" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#34d399"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="accentAmber" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#c084fc"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" stroke="#334155" stroke-width="1" opacity="0.22"/>
    </pattern>
    <filter id="shadow" x="-12%" y="-16%" width="124%" height="136%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#020617" flood-opacity="0.32"/>
    </filter>
    <style>
      .titleText { font: 800 22px Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; letter-spacing: .2px; }
      .smallText { font: 500 12px Inter, Segoe UI, Arial, sans-serif; fill: #94a3b8; }
      .metricValue { font: 900 28px Inter, Segoe UI, Arial, sans-serif; fill: #ffffff; }
      .metricLabel { font: 700 12px Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; }
      .metricSub { font: 500 10.5px Inter, Segoe UI, Arial, sans-serif; fill: #94a3b8; }
      .mono { font: 700 13px Consolas, Monaco, monospace; fill: #e2e8f0; }
      .track { fill: #1e293b; }
      .tile { fill: #0b1220; stroke: #1e293b; }
      @keyframes shimmer {
        0%, 100% { opacity: .72; }
        50% { opacity: 1; }
      }
      .motion { animation: shimmer 2.8s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="900" height="280" rx="24" fill="url(#bg)"/>
  <rect width="900" height="280" rx="24" fill="url(#grid)" opacity="0.18"/>
  <path d="M38 46 C188 6 298 18 432 46" stroke="#38bdf8" stroke-width="2" opacity="0.14"/>
  <path d="M468 234 C602 274 730 268 862 232" stroke="#34d399" stroke-width="2" opacity="0.14"/>

  <g filter="url(#shadow)">
    <rect x="28" y="28" width="402" height="224" rx="18" fill="#020617" opacity="0.78" stroke="#1e293b"/>
    <rect class="motion" x="54" y="48" width="82" height="4" rx="2" fill="url(#accentGreen)"/>
    <text x="54" y="76" class="titleText">GitHub stats</text>
    <text x="54" y="99" class="smallText">Portfolio snapshot for engineering review</text>

    <g transform="translate(54 118)">
      <rect class="tile" x="0" y="0" width="162" height="54" rx="10"/>
      <text x="16" y="34" class="metricValue">21</text>
      <text x="72" y="23" class="metricLabel">public repos</text>
      <text x="72" y="39" class="metricSub">labs and tools</text>

      <rect class="tile" x="184" y="0" width="162" height="54" rx="10"/>
      <text x="200" y="34" class="metricValue">15+</text>
      <text x="270" y="23" class="metricLabel">releases</text>
      <text x="270" y="39" class="metricSub">review assets</text>

      <rect class="tile" x="0" y="70" width="162" height="54" rx="10"/>
      <text x="16" y="104" class="metricValue">6</text>
      <text x="72" y="93" class="metricLabel">core stacks</text>
      <text x="72" y="109" class="metricSub">CV + HW + SW</text>

      <rect class="tile" x="184" y="70" width="162" height="54" rx="10"/>
      <text x="200" y="104" class="metricValue">1</text>
      <text x="270" y="93" class="metricLabel">profile hub</text>
      <text x="270" y="109" class="metricSub">clean portfolio</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="470" y="28" width="402" height="224" rx="18" fill="#020617" opacity="0.78" stroke="#1e293b"/>
    <rect class="motion" x="496" y="48" width="82" height="4" rx="2" fill="url(#accentBlue)"/>
    <text x="496" y="76" class="titleText">Top languages</text>
    <text x="496" y="99" class="smallText">Main stacks visible across the portfolio</text>

    <g transform="translate(496 123)">
      <text x="0" y="0" class="mono">Python</text>
      <rect class="track" x="118" y="-10" width="226" height="12" rx="6"/>
      <rect class="motion" x="118" y="-10" width="204" height="12" rx="6" fill="url(#accentBlue)"/>

      <text x="0" y="28" class="mono">MATLAB</text>
      <rect class="track" x="118" y="18" width="226" height="12" rx="6"/>
      <rect x="118" y="18" width="178" height="12" rx="6" fill="url(#accentAmber)"/>

      <text x="0" y="56" class="mono">C/C++</text>
      <rect class="track" x="118" y="46" width="226" height="12" rx="6"/>
      <rect x="118" y="46" width="150" height="12" rx="6" fill="url(#accentGreen)"/>

      <text x="0" y="84" class="mono">Verilog/VHDL</text>
      <rect class="track" x="118" y="74" width="226" height="12" rx="6"/>
      <rect x="118" y="74" width="134" height="12" rx="6" fill="url(#accentPurple)"/>

      <text x="0" y="112" class="mono">Typst</text>
      <rect class="track" x="118" y="102" width="226" height="12" rx="6"/>
      <rect x="118" y="102" width="118" height="12" rx="6" fill="#22d3ee"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio inventory and project areas</title>
  <desc id="desc">October 1, 2026 inventory: 36 public repositories, 33 public non-fork repositories, and six featured projects. Project areas are labels, not proficiency scores.</desc>
  <style>
    .bg { fill: #0f172a; }
    .panel { fill: #172a3a; }
    .title { font: 700 22px Arial, Helvetica, sans-serif; fill: #f8fafc; }
    .number { font: 700 36px Arial, Helvetica, sans-serif; fill: #7dd3fc; }
    .body { font: 400 17px Arial, Helvetica, sans-serif; fill: #dbeafe; }
    .small { font: 400 14px Arial, Helvetica, sans-serif; fill: #cbd5e1; }
  </style>
  <rect class="bg" width="900" height="280" rx="22"/>
  <rect class="panel" x="24" y="24" width="380" height="232" rx="16"/>
  <rect class="panel" x="424" y="24" width="452" height="232" rx="16"/>
  <text x="48" y="63" class="title">Portfolio inventory</text>
  <text x="48" y="111" class="number">36</text><text x="112" y="105" class="body">public repositories</text>
  <text x="48" y="159" class="number">33</text><text x="112" y="153" class="body">public non-fork repositories</text>
  <text x="48" y="207" class="number">6</text><text x="112" y="201" class="body">featured projects</text>
  <text x="48" y="236" class="small">GitHub inventory checked October 1, 2026</text>
  <text x="448" y="63" class="title">Featured project areas</text>
  <text x="448" y="103" class="body">Computer vision and image processing</text>
  <text x="448" y="137" class="body">Machine learning and deep learning</text>
  <text x="448" y="171" class="body">Computer networks and telecommunications</text>
  <text x="448" y="205" class="body">Digital signal processing</text>
  <text x="448" y="236" class="small">Code, notebooks, reports, results, and releases</text>
</svg>

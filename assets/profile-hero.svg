<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Luong Hai Long engineering portfolio banner</title>
  <desc id="desc">Self-hosted line-free banner for Computer Vision, AI, Machine Learning, network communications, FPGA SoC and embedded systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#0f766e" />
      <stop offset="72%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <style>
      .chip { fill: rgba(15,23,42,.50); stroke: rgba(255,255,255,.24); stroke-width: 1.2; }
      .small { font: 700 20px Segoe UI, Arial, sans-serif; letter-spacing: 0; fill: #dbeafe; }
      .tiny { font: 700 15px Segoe UI, Arial, sans-serif; fill: #ecfeff; }
      .name { font: 800 60px Segoe UI, Arial, sans-serif; letter-spacing: 0; fill: #ffffff; }
      .desc { font: 650 22px Segoe UI, Arial, sans-serif; fill: #e0f2fe; }
      .mono { font: 700 17px Consolas, Monaco, monospace; fill: #a7f3d0; }
      .pulse { animation: pulse 3.8s ease-in-out infinite; transform-origin: center; }
      .soft { animation: soft 5.2s ease-in-out infinite; transform-origin: center; }
      @keyframes pulse { 0%, 100% { opacity: .72; transform: scale(.985); } 50% { opacity: 1; transform: scale(1.025); } }
      @keyframes soft { 0%, 100% { opacity: .62; } 50% { opacity: 1; } }
    </style>
  </defs>
  <rect width="1200" height="300" rx="28" fill="url(#bg)" />
  <rect x="42" y="36" width="1116" height="228" rx="24" fill="rgba(15,23,42,.36)" stroke="rgba(255,255,255,.18)" />
  <g class="pulse">
    <rect x="72" y="56" width="226" height="52" rx="16" class="chip" />
    <text x="98" y="89" class="small">Computer Vision</text>
  </g>
  <g class="soft">
    <rect x="872" y="56" width="244" height="52" rx="16" class="chip" />
    <text x="898" y="89" class="small">AI / Machine Learning</text>
  </g>
  <g class="soft">
    <rect x="92" y="196" width="188" height="52" rx="16" class="chip" />
    <text x="120" y="229" class="small">FPGA / SoC</text>
  </g>
  <g class="pulse">
    <rect x="826" y="196" width="290" height="52" rx="16" class="chip" />
    <text x="856" y="229" class="small">Network Communications</text>
  </g>
  <g transform="translate(352 66)">
    <text x="0" y="0" class="mono">vision -> model -> networked system -> proof</text>
    <text x="0" y="72" class="name">Luong Hai Long</text>
    <text x="0" y="116" class="desc">Electronics and Telecommunications @ HCMUS</text>
    <g transform="translate(0 146)">
      <rect width="84" height="30" rx="15" fill="rgba(255,255,255,.16)" stroke="rgba(255,255,255,.24)" />
      <text x="22" y="20" class="tiny">YOLO</text>
      <rect x="100" width="108" height="30" rx="15" fill="rgba(255,255,255,.16)" stroke="rgba(255,255,255,.24)" />
      <text x="119" y="20" class="tiny">PyTorch</text>
      <rect x="224" width="104" height="30" rx="15" fill="rgba(255,255,255,.16)" stroke="rgba(255,255,255,.24)" />
      <text x="246" y="20" class="tiny">OpenCV</text>
      <rect x="344" width="94" height="30" rx="15" fill="rgba(255,255,255,.16)" stroke="rgba(255,255,255,.24)" />
      <text x="362" y="20" class="tiny">TCP/IP</text>
    </g>
  </g>
  <g fill="#e0f2fe" class="soft">
    <circle cx="318" cy="92" r="5" />
    <circle cx="842" cy="98" r="5" />
    <circle cx="782" cy="224" r="5" />
    <circle cx="338" cy="226" r="5" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Luong Hai Long engineering portfolio</title>
  <desc id="desc">Computer vision, machine learning, deep learning, computer networks, and telecommunications. Electronics and Telecommunications Engineering at VNUHCM University of Science.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0f172a"/><stop offset="1" stop-color="#123b50"/>
    </linearGradient>
    <style>
      .name { font: 700 58px Arial, Helvetica, sans-serif; fill: #f8fafc; }
      .label { font: 700 17px Arial, Helvetica, sans-serif; fill: #7dd3fc; letter-spacing: 2px; }
      .body { font: 400 23px Arial, Helvetica, sans-serif; fill: #dbeafe; }
      .small { font: 400 19px Arial, Helvetica, sans-serif; fill: #cbd5e1; }
      .accent { animation: breathe 5s ease-in-out infinite; }
      @keyframes breathe { 0%,100% { opacity: .65; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .accent { animation: none; } }
    </style>
  </defs>
  <rect width="1200" height="280" rx="22" fill="url(#bg)"/>
  <rect class="accent" x="1108" y="38" width="48" height="48" rx="12" fill="#38bdf8"/>
  <text x="48" y="52" class="label">ENGINEERING PORTFOLIO</text>
  <text x="48" y="121" class="name">Luong Hai Long</text>
  <text x="48" y="169" class="body">Computer Vision, Machine Learning, and Deep Learning</text>
  <text x="48" y="204" class="body">Computer Networks and Telecommunications</text>
  <text x="48" y="248" class="small">Electronics and Telecommunications Engineering | VNUHCM - University of Science</text>
</svg>

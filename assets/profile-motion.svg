<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">Networked AI systems motion card</title>
  <desc id="desc">Animated SVG showing computer vision, machine learning, communications, FPGA and embedded systems as connected evidence tracks.</desc>
  <style>
    .bg { fill: #0f172a; }
    .title { font: 800 30px Segoe UI, Arial, sans-serif; fill: #f8fafc; }
    .label { font: 700 17px Segoe UI, Arial, sans-serif; fill: #e0f2fe; }
    .small { font: 600 14px Segoe UI, Arial, sans-serif; fill: #bae6fd; }
    .card { fill: #111827; stroke: #38bdf8; stroke-width: 2; }
    .card2 { fill: #172554; stroke: #f59e0b; stroke-width: 2; }
    .pulse { animation: pulse 2.2s ease-in-out infinite; transform-origin: center; }
    @keyframes pulse { 0%, 100% { opacity: .55; transform: scale(.96); } 50% { opacity: 1; transform: scale(1.04); } }
  </style>
  <rect class="bg" width="900" height="320" rx="28" />
  <text x="48" y="58" class="title">Evidence-Backed Engineering Portfolio</text>
  <text x="48" y="88" class="small">Computer Vision - AI/ML - Network Communications - FPGA/SoC - Embedded Systems</text>
  <rect x="40" y="112" width="820" height="132" rx="26" fill="#0b1220" stroke="#1e293b" stroke-width="2" opacity=".72" />
  <g>
    <rect x="52" y="124" width="182" height="96" rx="18" class="card" />
    <rect x="268" y="124" width="182" height="96" rx="18" class="card2" />
    <rect x="484" y="124" width="182" height="96" rx="18" class="card" />
    <rect x="700" y="124" width="148" height="96" rx="18" class="card2" />
    <circle class="pulse" cx="143" cy="172" r="24" fill="#38bdf8" />
    <circle class="pulse" cx="359" cy="172" r="24" fill="#f59e0b" />
    <circle class="pulse" cx="575" cy="172" r="24" fill="#38bdf8" />
    <circle class="pulse" cx="774" cy="172" r="24" fill="#f59e0b" />
  </g>
  <text x="143" y="244" text-anchor="middle" class="label">YOLO/OCR</text>
  <text x="359" y="244" text-anchor="middle" class="label">PyTorch</text>
  <text x="575" y="244" text-anchor="middle" class="label">TCP/BLE</text>
  <text x="774" y="244" text-anchor="middle" class="label">FPGA</text>
  <text x="450" y="292" text-anchor="middle" class="small">Release-backed repositories, visual assets, reports and bounded prototype notes.</text>
</svg>

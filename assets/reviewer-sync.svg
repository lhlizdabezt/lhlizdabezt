<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">June 2026 reviewer guide sync</title>
  <desc id="desc">Nine refreshed repositories with English reviewer guides, releases, topics, and professional profile links.</desc>
  <defs>
    <style>
      .bg { fill: #0B3D91; }
      .panel { fill: #F8FAFC; opacity: 0.98; }
      .card { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; }
      .label { fill: #0B3D91; font: 700 18px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .title { fill: #111827; font: 700 38px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .body { fill: #334155; font: 500 20px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .repo { fill: #111827; font: 700 17px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .meta { fill: #475569; font: 500 14px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .mark { fill: #FFFFFF; opacity: 0.16; animation: fade 5s ease-in-out infinite; }
      .card { animation: lift 6s ease-in-out infinite; }
      @keyframes fade { 0%, 100% { opacity: 0.12; } 50% { opacity: 0.24; } }
      @keyframes lift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    </style>
  </defs>
